<!DOCTYPE html>
<html lang="en">
<head>
    <title>Students</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h2>Students</h2>
            <a href="/dashboard">Dashboard</a>
        </div>
        <a href="/add-student">+ Add Student</a>
        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
            {% for s in students %}
            <tr>
                <td>{{ s['name'] }}</td>
                <td>{{ s['email'] }}</td>
                <td>{{ s['course'] }}</td>
                <td class="actions">
                    <a href="/edit/{{ s['id'] }}">Edit</a>
                    <a href="/delete/{{ s['id'] }}">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
