<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h2>Admin Panel</h2>
<h3>All Users</h3>
<table>
    <tr><th>ID</th><th>Username</th><th>Role</th></tr>
    {% for u in users %}
    <tr>
        <td>{{ u['id'] }}</td>
        <td>{{ u['username'] }}</td>
        <td>{{ u['role'] }}</td>
    </tr>
    {% endfor %}
</table>
<hr>
<h3>All Students</h3>
<p><a href="{{ url_for('add_student') }}">+ Add New Student</a></p>
<table>
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Action</th></tr>
    {% for s in students %}
    <tr>
        <td>{{ s['id'] }}</td>
        <td>{{ s['name'] }}</td>
        <td>{{ s['email'] }}</td>
        <td>{{ s['course'] }}</td>
         <td>
            <a href="{{ url_for('edit_student', id=s['id']) }}">Edit</a>
            |
            <a href="{{ url_for('admin_delete_student', id=s['id']) }}"
               onclick="return confirm('Delete this student?')">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
</div>
</body>
</html>
